name: CI

# Continuous integration for ConsaPass.
#
# SINGLE-TRUNK STATE (current): the project has collapsed to one branch, `main`,
# which now carries the PRODUCTION setup — the PostgreSQL Prisma schema and the
# production render.yaml — and Render auto-deploys `main` on every commit.
#
# Because `main` now uses the Postgres provider, the local SQLite test/build
# path does NOT work unmodified here: tests/globalSetup.ts runs
# `prisma db push` against a `file:` SQLite URL, which the Postgres provider
# rejects. Per the current project decision, verification is done against the
# live Render/Postgres environment rather than in CI, so the automated
# typecheck/test/build job below is DISABLED (manual trigger only) to avoid a
# permanently-red pipeline.
#
# TO RE-ENABLE proper CI once a dev environment exists (recommended before any
# real school data): either
#   (a) run the suite against a Postgres service container, or
#   (b) override the datasource provider to sqlite at test time, e.g. add a step
#       before "Run tests" that swaps `provider = "postgresql"` -> `"sqlite"` in
#       a throwaway copy of prisma/schema.prisma (the schema is kept
#       Postgres/SQLite-compatible), then run `prisma generate` + `npm test`.
# Then restore the `push`/`pull_request` triggers below.

on:
  # Disabled automatic runs (see header). Run manually from the Actions tab if
  # you want an on-demand check.
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    env:
      # The app/build read these at import time. Tests override DATABASE_URL to
      # a SQLite file themselves; this default keeps `next build` and Prisma
      # generate happy without a real database.
      DATABASE_URL: "file:./prisma/dev.db"
      SESSION_SECRET: "ci-placeholder-secret-000000000000000000000000000000"
      SESSION_TTL_SECONDS: "28800"
      EMAIL_PROVIDER: "mock"
      NODE_ENV: "test"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        # next build also typechecks app code; DATABASE_URL is set above.
        run: npm run build
