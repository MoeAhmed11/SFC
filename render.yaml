# Render Blueprint for SchoolConnect.
#
# Provisions three resources:
#   1. schoolconnect-db      — managed Postgres (Frankfurt region for UK/EU
#                              data residency — see HOSTING.md).
#   2. schoolconnect-web     — the Next.js app (build, migrate, start).
#   3. schoolconnect-worker  — a cron job that drains due notifications and
#                              runs the retention sweep (scripts/worker.ts),
#                              closing the "no background worker deployment"
#                              gap noted in PILOT_READINESS.md.
#
# Deploy: push this repo to Git, then in the Render Dashboard choose
# "New > Blueprint" and point it at the repo. See HOSTING.md for the full
# walkthrough, required secrets, and post-deploy steps.
#
# Secrets (sync: false) are NOT set here — Render prompts for them once
# during the initial Blueprint creation and they are never committed.

databases:
  - name: schoolconnect-db
    plan: basic-1gb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: schoolconnect-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    buildCommand: npm ci && npm run prisma:generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolconnect-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: EMAIL_PROVIDER
        value: mock
      - key: APP_BASE_URL
        value: https://schoolconnect-web.onrender.com
      - key: PARENT_LINK_BASE_URL
        value: https://schoolconnect-web.onrender.com/c

  - type: cron
    name: schoolconnect-worker
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    schedule: "*/15 * * * *"
    buildCommand: npm ci && npm run prisma:generate
    startCommand: NODE_ENV=production npm run worker -- all
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolconnect-db
          property: connectionString
      - key: EMAIL_PROVIDER
        value: mock
      - key: PARENT_LINK_BASE_URL
        value: https://schoolconnect-web.onrender.com/c
